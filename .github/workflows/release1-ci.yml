name: release1-ci

# Имена jobs совпадают с tools/release1_done.py CI_JOBS для attestation.
# Реальные шаги берутся только из спецификаций выпуска; иначе job падает с GAP.
on:
  pull_request:
  push:
    branches: [main, feat/release1-demo]
  merge_group:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  tools-check-sh:
    name: tools/check.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Python venv
        run: |
          python -m venv .venv
          .venv/bin/pip install -r tools/requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: tools/check.sh

  tools-check-code-sh:
    name: tools/check-code.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Python venv
        run: |
          python -m venv .venv
          .venv/bin/pip install -r tools/requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: tools/check-code.sh

  generation:
    name: generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - name: Contract type generation (D97, gen/README)
        run: |
          set -euo pipefail
          if [[ ! -f tools/generate.sh ]]; then
            echo "Отсутствует tools/generate.sh: контрактная генерация типов из docs/contracts/ (D97, gen/README) не настроена."
            exit 1
          fi
          bash tools/generate.sh
      - name: Fail only when regenerated output differs from git
        run: git diff --exit-code

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm run build
        working-directory: web

  storybook:
    name: storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - name: Storybook production build (D315)
        run: npm run build-storybook
        working-directory: web

  size-limit:
    name: size-limit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - name: Bundle size budgets (D315)
        run: |
          if node -e 'const s=require("./package.json").scripts||{}; process.exit(s["size-limit"]?0:1)'; then
            npm run size-limit
          else
            npx --no-install size-limit
          fi
        working-directory: web

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: browser-actions/setup-chrome@v1
      - name: Python venv
        run: |
          python -m venv .venv
          .venv/bin/pip install -r tools/requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm ci --ignore-scripts
        working-directory: tools/e2e
      - run: npm test
        working-directory: tools/e2e

  contract-live:
    name: contract-live
    runs-on: ubuntu-latest
    steps:
      - name: GAP — contract-live
        run: |
          echo "GAP: ни один бриф выпуска не задаёт команду CI с именем contract-live; tools/check.sh и scenario/run_test.go не заменяют такой job."
          exit 1

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - name: GAP — docker
        run: |
          echo "GAP: отдельной проверки CI с именем docker в спецификациях нет (README и tools/dev-*.sh используют Docker внутри e2e и локальных скриптов)."
          exit 1

  chrome:
    name: chrome
    runs-on: ubuntu-latest
    steps:
      - name: GAP — chrome
        run: |
          echo "GAP: отдельной проверки CI с именем chrome в спецификациях нет (briefs/r1-e1-browser.md и Playwright channel: chrome входят в job e2e)."
          exit 1

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ubuntu VM acceptance (brief §8, IAC-VM / QA-VM)
        env:
          VM_HYPERVISOR_ACCESS: ${{ secrets.VM_HYPERVISOR_ACCESS }}
          QA_VM_SSH_HOST: ${{ secrets.QA_VM_SSH_HOST }}
        run: |
          set -euo pipefail
          if [[ -x tools/vm-acceptance.sh ]]; then
            tools/vm-acceptance.sh
          else
            echo "§8 Ubuntu VM: отсутствует tools/vm-acceptance.sh (проверка «с нуля VM → развёртывание → перезагрузка», brief §8)."
            if [[ -z "${VM_HYPERVISOR_ACCESS:-}" ]]; then
              echo "Отсутствует секрет GitHub VM_HYPERVISOR_ACCESS (доступ к гипервизору для одноразовой VM)."
            fi
            if [[ -z "${QA_VM_SSH_HOST:-}" ]]; then
              echo "Отсутствует секрет GitHub QA_VM_SSH_HOST (SSH к выделенной гостевой Ubuntu)."
            fi
            exit 1
          fi