name: docs-check

# Проверки контрактов и примеров (D97, D133): tools/check.sh.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - name: Python venv (tools/check-code.sh ищет ruff в .venv)
        run: |
          python -m venv .venv
          .venv/bin/pip install -r tools/requirements.txt
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: tools/check.sh
