# Примеры к platform/web.md (D133). Перенесено из раздела «Таблицы примеров» без изменения смысла.
# Поля: id, rule (номера правил спецификации), given (ситуация или вход), expect (ожидаемый результат).
# Проверяет tools/examples/check_text_examples.py: число строк, наличие правил в спецификации, уникальность id.
- id: web-01
  rule: WB-R1
  given: экран 360 px
  expect: нет горизонтальной прокрутки, кнопки ≥ 44 px
- id: web-02
  rule: WB-R4
  given: ответ API на открытую задачу
  expect: в данных нет ключа и пометок верных опций
- id: web-03
  rule: WB-R7
  given: страницу приглашения открыл бот
  expect: ничего не изменилось
- id: web-04
  rule: WB-R12
  given: выбрано 2 из 3 букв
  expect: «Ответить» недоступна
- id: web-05
  rule: WB-R13
  given: введено «1124»
  expect: подсказка «цифры не должны повторяться», запрос не отправлен
- id: web-06
  rule: WB-R14
  given: введено «12,5»
  expect: подсказка «введите целое число», запрос не отправлен
- id: web-07
  rule: WB-R14
  given: введено «−3» через кнопку «−»
  expect: отправлено как «-3»
- id: web-08
  rule: WB-R15
  given: часть В, первая попытка неверна
  expect: «неверно, осталась 1 попытка», без ключа
- id: web-09
  rule: WB-R15
  given: срез
  expect: «ответ принят», без вердикта
- id: web-10
  rule: WB-R16
  given: 4 задачи без ответа
  expect: подтверждение «осталось 4»
- id: web-11
  rule: WB-R17
  given: спор с причиной «другое» и 400 символами текста
  expect: поле не принимает больше 300
- id: web-12
  rule: WB-R18
  given: нет связи при ответе
  expect: статус «не отправлено», после связи отправлен один раз
- id: web-13
  rule: WB-R19
  given: ответ части В в очереди
  expect: вторая попытка недоступна
- id: web-14
  rule: WB-R21
  given: репетитор открывает кабинет
  expect: экран «Ученики»
- id: web-15
  rule: WB-R22
  given: открыта «Подготовка»
  expect: ключ скрыт за «показать»
- id: web-16
  rule: WB-R23
  given: ДЗ выдано, ответов нет
  expect: кнопка «Отозвать»
- id: web-17
  rule: WB-R23
  given: ДЗ выдано, есть ответы
  expect: «Отозвать» недоступна
- id: web-18
  rule: WB-R26
  given: блок содержит `<script>`
  expect: не выводится, ошибка CI
- id: web-19
  rule: WB-R28
  given: PDF листка ДЗ
  expect: условия без ключей
- id: web-20
  rule: WB-R30
  given: запрос не прошёл по сети
  expect: «Нет связи», «Повторить»
