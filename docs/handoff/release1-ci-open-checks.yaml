# Реестр проверок release1-ci без готовой команды (briefs/CURSOR-PROJECT-RELEASE1.md §«Проверки без готовой команды»).
# Синтетические данные только. Обновляйте при закрытии job в .github/workflows/release1-ci.yml.

checks:
  - job: deploy
    status: open
    owner: infra-reviewer
    criterion: brief §8 / IAC-VM + QA-VM — чистая Ubuntu, развёртывание, перезагрузка.
    next_step: >-
      RELEASE_SHA=${{ github.sha }} bash tools/vm-acceptance.sh;
      владелец репозитория: добавить secrets.VM_HYPERVISOR_ACCESS (исполняемый сценарий создания VM)
      и secrets.QA_VM_SSH_HOST (SSH к одноразовой чистой Ubuntu).
    wired_command: bash tools/vm-acceptance.sh
    blocked_reason: >-
      missing: QA_VM_SSH_HOST (SSH к отдельной чистой Ubuntu, не существующей пользовательской VM);
      missing: VM_HYPERVISOR_ACCESS (ограниченный доступ к гипервизору для одноразовой тестовой VM).