# Реестр проверок release1-ci без готовой команды (briefs/CURSOR-PROJECT-RELEASE1.md §«Проверки без готовой команды»).
# Синтетические данные только. Обновляйте при закрытии job в .github/workflows/release1-ci.yml.

checks:
  - job: size-limit
    status: open
    owner: integration-agent
    criterion: D315 — bundle проверяется size-limit в CI; нужен воспроизводимый числовой бюджет после измерения production build.
    next_step: npm run build, зафиксировать maxGzipJsBytes в web/size-limit.budget.json и подключить tools/ci/size-limit-measure.sh.
    wired_command: tools/ci/size-limit-measure.sh
    blocked_reason: файл web/size-limit.budget.json отсутствует; число не придумываем.

  - job: deploy
    status: open
    owner: infra-reviewer
    criterion: brief §8 / IAC-VM + QA-VM — чистая Ubuntu, развёртывание, перезагрузка.
    next_step: tools/vm-acceptance.sh и секреты VM_HYPERVISOR_ACCESS, QA_VM_SSH_HOST.
    wired_command: tools/vm-acceptance.sh
    blocked_reason: скрипт и гостевая VM недоступны в этом контуре.