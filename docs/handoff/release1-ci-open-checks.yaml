      RELEASE_SHA=7720ffc36c90c4475ea3f273bfd6b90f066ebb9e bash tools/vm-acceptance.sh;
      секреты VM_HYPERVISOR_ACCESS и QA_VM_SSH_HOST на отдельную чистую Ubuntu (не существующую VM).
