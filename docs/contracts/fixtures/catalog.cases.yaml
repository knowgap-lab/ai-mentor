  def: lesson_template
  valid: true
  doc:
    id: ct-math:L07
    topics: [ct-math:M10]
    review: [ct-math:M04, ct-math:M08]
    duration_min: 60
    stages:
      - id: ct-math:L07.G1
        minutes: [0, 8]
        title: Разминка-вспоминание
        kind: warmup
        blocks: []
        practice:
          - {type: "ct-math:M04.T13", subvariant: "ct-math:M04.T13.S1", role: solve_alone, theory_block: "ct-math:M04.B02"}
      - id: ct-math:L07.G3
        minutes: [13, 30]
        title: Новая тема
        kind: theory
        blocks: ["ct-math:M10.B05", "ct-math:M10.B06"]
        practice: []
    homework:
      budget_hours: 6
      items:
        - {source: new_topic, series: [{type: "ct-math:M10.T01", count: 4}, {type: "ct-math:M10.T02", count: 6}], difficulty: [1, 1]}
        - {source: review, series: [{type: "ct-math:M04.T13", count: 1}]}
        - {source: ct_format, series: [{type: "ct-math:M10.T18", count: 1}]}
    generation_notes: "Числа «чистые»"
